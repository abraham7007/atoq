<!doctype html><html lang="es-PE"><head><meta charset="utf-8">
<title>atoqlab · Post promocional</title>
<link rel="stylesheet" href="print.css">
<style>
  @page{size:1080px 1080px;margin:0}
  .pieza{--w:1080px;--h:1080px;--sangrado:0px}
  .seguro{inset:64px}
  .zorro{width:760px;right:-250px;top:300px}
  .cabecera img{width:230px}
  h1{font-size:60px;line-height:1.03;margin-top:26px}
  .lead{font-size:23px;line-height:1.45;margin-top:18px;max-width:700px;opacity:.86}
  .foto{width:100%;aspect-ratio:16/6;border-radius:12px;margin-top:26px}
  .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:auto}
  .dato b{font-size:29px}
  .dato span{font-size:12px}
  .cierre{display:flex;align-items:center;gap:26px;margin-top:30px}
  .pastilla{font-size:21px;padding:15px 32px}
  .cierre p{font-size:19px;font-weight:700;line-height:1.35;opacity:.85}
</style></head><body>

<section class="pieza pieza--navy">
  <img class="zorro" src="../../logos/svg/atoqlab-isotipo-solido-blanco.svg" alt="">
  <div class="filete" style="height:14px"></div>
  <div class="seguro">
    <header class="cabecera"><img src="../../logos/svg/atoqlab-horizontal-blanco.svg" alt="atoqlab"></header>
    <h1>Habilitado y conformado de plancha metálica.</h1>
    <p class="lead">Acero, inoxidable, aluminio y galvanizada. Habilitado
    y conformado en una sola pasada por el taller.</p>
    <div class="foto"><img src="../fotos/encofrados-fila.jpg" alt=""></div>
    <div class="datos">
      <div class="dato"><b>20 mm</b><span>Espesor</span></div>
      <div class="dato"><b>3200 mm</b><span>Plegado</span></div>
      <div class="dato"><b>24 h</b><span>Cotización</span></div>
    </div>
    <div class="cierre">
      <span class="pastilla">Cotiza gratis</span>
      <p>+51 999 888 777<br>atoqlab.pe</p>
    </div>
  </div>
</section>
</body></html>
