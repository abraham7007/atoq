<!doctype html><html lang="es-PE"><head><meta charset="utf-8">
<title>atoqlab · Historia promocional</title>
<link rel="stylesheet" href="print.css">
<style>
  @page{size:1080px 1920px;margin:0}
  .pieza{--w:1080px;--h:1920px;--sangrado:0px}
  /* Instagram y WhatsApp tapan ~250 px arriba y abajo con sus controles. */
  .seguro{inset:280px 80px 300px}
  .zorro{width:880px;right:-300px;top:700px}
  .cabecera img{width:280px}
  h1{font-size:82px;line-height:1.02;margin-top:56px}
  .lead{font-size:30px;line-height:1.42;margin-top:30px;max-width:760px;opacity:.86}
  .foto{width:100%;aspect-ratio:16/9;border-radius:16px;margin-top:52px}
  .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:auto}
  .dato b{font-size:38px}
  .dato span{font-size:15px}
  .qr{margin-top:46px;gap:22px}
  .qr img{width:130px;height:130px}
  .qr p{font-size:24px;color:#fff;opacity:.85;line-height:1.35}
  .qr p b{font-size:31px;display:block}
</style></head><body>

<section class="pieza pieza--navy">
  <img class="zorro" src="../../logos/svg/atoqlab-isotipo-solido-blanco.svg" alt="">
  <div class="filete" style="height:18px"></div>
  <div class="seguro">
    <header class="cabecera"><img src="../../logos/svg/atoqlab-horizontal-blanco.svg" alt="atoqlab"></header>
    <h1>Habilitado y conformado de plancha metálica.</h1>
    <p class="lead">Corte y conformado de acero, inoxidable, aluminio y galvanizada.
    Las dos operaciones bajo la misma programación.</p>
    <div class="foto"><img src="../fotos/laser-dxtech.jpg" alt=""></div>
    <div class="datos">
      <div class="dato"><b>20 mm</b><span>Espesor</span></div>
      <div class="dato"><b>3200 mm</b><span>Longitud de plegado</span></div>
      <div class="dato"><b>24 horas</b><span>Cotización</span></div>
    </div>
    <div class="qr">
      <img src="qr/whatsapp-blanco.svg" alt="">
      <p><b>+51 999 888 777</b>Escanea y cotiza gratis</p>
    </div>
  </div>
</section>
</body></html>
